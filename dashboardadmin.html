<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checklist Admin Dashboard</title>
  <link rel="stylesheet" href="style4.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
</head>
<body>
  <div id="adminBanner">
    📢 You are viewing the <span class="underlined">Admin Version</span> of the Checklist Dashboard. Changes here affect all users.
  </div>

  <h1>User Checklist Dashboard - ADMIN Version 🔐</h1>
  <div id="dashboardContainer">
    <div id="dashboard"></div>

    <div id="errorPanel">
      <h2>⚠️ Issues Marked "No"</h2>
      <ul id="errorList"></ul>
    </div>
  </div>

  <!-- Modal -->
  <div id="commentModal" class="hidden">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <h3 id="modalItemHeader" style="margin-top:0;"></h3>
      <p id="commentText"></p>

      <label for="statusUpdate">Change Status:</label>
      <select id="statusUpdate">
        <option value="Yes">Yes</option>
        <option value="N/A">N/A</option>
        <option value="No">No</option>
      </select>

      <label for="commentUpdate">Edit Comment:</label>
      <textarea id="commentUpdate" rows="3" style="width:100%;"></textarea>

      <button id="saveStatusBtn">Save</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDANwGnTgz2Sd-VS-9tjrsT5FvsUpe2NQc",
      authDomain: "sitevisit2025-6a6ce.firebaseapp.com",
      projectId: "sitevisit2025-6a6ce"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const dashboard = document.getElementById("dashboard");
    let allNoEntries = [];
    let currentModalEntry = null;

    const expectedFileCounts = {
      "Conditions": 52,
      "Worksheets": 75,
      "Standard1": 11,
      "Standard2/Advanced Emergency Medical Technician": 46,
      "Standard2/Automation Technology": 46,
      "Standard2/Automotive Technology": 46,
      "Standard2/Commercial Driver's License Class A": 46,
      "Standard2/Culinary Arts": 46,
      "Standard2/Electrical Apprenticeship": 46,
      "Standard2/Emergency Medical Technician": 46,
      "Standard2/Firefighter": 46,
      "Standard2/Information Technology": 46,
      "Standard2/Master Esthetician": 46,
      "Standard2/Medical Assistant": 46,
      "Standard2/Medical Office Receptionist": 46,
      "Standard2/Nursing Assistant": 46,
      "Standard2/Paramedic": 46,
      "Standard2/Pharmacy Technician": 46,
      "Standard2/Phlebotomy": 46,
      "Standard2/Plumbing Apprenticeship": 46,
      "Standard2/Practical Nursing": 46,
      "Standard2/Software Development": 46,
      "Standard2/Surgical Technology": 46,
      "Standard2/Welding Technology": 46,
      "Standard3": 24,
      "Standard4": 8,
      "Standard5": 13,
      "Standard6": 22,
      "Standard7": 25,
      "Refund Policy": 15,
      "Standard8": 21,
      "Standard9": 5,
      "Standard10": 42,
      "ISC - Beaver": 18,
      "ISC - Kane": 18,
      "ISC - Richfield": 18
    };

    function cleanFileName(fileName) {
      return fileName.replace(/\.docx\.pdf$/i, '').replace(/\.pdf$/i, '');
    }

    function computeFixedCompletionPercentage(folder, entries) {
      const expectedCount = expectedFileCounts[folder] || 0;
      const uniqueCompletedFiles = new Set();
      entries.forEach(e => {
        if (e.status === "Yes" || e.status === "N/A") {
          uniqueCompletedFiles.add(e.fileKey);
        }
      });
      return expectedCount > 0
        ? Math.round((uniqueCompletedFiles.size / expectedCount) * 100)
        : 0;
    }

    function createRow(entry) {
      const row = document.createElement("tr");
      row.className = entry.status === "No" ? "row-error" : "";
      row.innerHTML = `
        <td>${cleanFileName(entry.fileKey)}</td>
        <td>${entry.status}</td>
        <td>${entry.comment || "-"}</td>
      `;
      row.addEventListener("click", () => {
        showCommentModal(entry.comment, entry.fileKey, entry.userId, entry.item, entry.status);
      });
      return row;
    }

    function createFolderNode(name, percent, parent, hidePercent = false) {
      const folderDiv = document.createElement("div");
      folderDiv.className = "folder";
      const label = document.createElement("div");
      label.className = "folder-label";

      const titleSpan = document.createElement("span");
      titleSpan.textContent = name;
      label.appendChild(titleSpan);

      if (!hidePercent) {
        const percentSpan = document.createElement("span");
        percentSpan.textContent = ` (${percent}% complete)`;
        percentSpan.style.marginLeft = "4px";
        percentSpan.style.color = percent < 100 ? "red" : "green";
        label.appendChild(percentSpan);
      }

      const content = document.createElement("div");
      content.className = "folder-content";
      content.style.display = "none";
      label.addEventListener("click", () => {
        content.style.display = content.style.display === "none" ? "block" : "none";
      });

      folderDiv.appendChild(label);
      folderDiv.appendChild(content);
      parent.appendChild(folderDiv);
      return content;
    }

    function showCommentModal(comment, fileKey, userId, item, currentStatus) {
      currentModalEntry = { userId, fileKey, item };
      document.getElementById("modalItemHeader").textContent = cleanFileName(fileKey);
      document.getElementById("commentText").textContent = comment;
      document.getElementById("commentUpdate").value = comment || "";
      document.getElementById("statusUpdate").value = currentStatus;
      document.getElementById("commentModal").classList.remove("hidden");
    }

    document.getElementById("saveStatusBtn").onclick = async () => {
      const { userId, fileKey, item } = currentModalEntry;
      const newStatus = document.getElementById("statusUpdate").value;
      const newComment = document.getElementById("commentUpdate").value;

      try {
        await db.collection("checklists").doc(userId).set({
          checklist: {
            [fileKey]: {
              [item]: {
                status: newStatus,
                comment: newComment
              }
            }
          }
        }, { merge: true });

        alert("✅ Status updated.");
        document.getElementById("dashboard").innerHTML = "";
        document.getElementById("errorList").innerHTML = "";
        loadDashboard();
      } catch (e) {
        console.error("Failed to update:", e);
        alert("❌ Error updating entry.");
      }

      document.getElementById("commentModal").classList.add("hidden");
    };

    document.getElementById("closeModal").onclick = () => {
      document.getElementById("commentModal").classList.add("hidden");
    };

    window.onclick = (e) => {
      if (e.target === document.getElementById("commentModal")) {
        document.getElementById("commentModal").classList.add("hidden");
      }
    };

    async function loadDashboard() {
      const snapshot = await db.collection("checklists").get();
      allNoEntries = [];

      snapshot.forEach(doc => {
        const data = doc.data();
        const entries = [];
        const userId = data.userId;
        const checklist = data.checklist || {};

        Object.entries(checklist).forEach(([fileKey, items]) => {
          Object.entries(items).forEach(([item, entry]) => {
            const fullEntry = { fileKey, item, ...entry, userId };
            entries.push(fullEntry);
            if (entry.status === "No") {
              allNoEntries.push(fullEntry);
            }
          });
        });

        entries.sort((a, b) => a.fileKey.localeCompare(b.fileKey));

        const folderMap = {};
        entries.forEach(entry => {
          const parts = entry.fileKey.split("/");
          const root = parts[0];
          const sub = (root === "Standard2" && parts.length >= 2) ? parts[1] : null;

          if (!folderMap[root]) folderMap[root] = {};
          const subMap = folderMap[root];
          if (sub) {
            if (!subMap[sub]) subMap[sub] = [];
            subMap[sub].push(entry);
          } else {
            if (!subMap["__root__"]) subMap["__root__"] = [];
            subMap["__root__"].push(entry);
          }
        });

        const userSection = document.createElement("div");
        userSection.className = "user-section";

        const userHeader = document.createElement("div");
        userHeader.className = "user-header";
        userHeader.textContent = `User: ${userId}`;
        const userContent = document.createElement("div");
        userContent.style.display = "none";
        userHeader.addEventListener("click", () => {
          userContent.style.display = userContent.style.display === "none" ? "block" : "none";
        });

        userSection.appendChild(userHeader);

        Object.entries(folderMap).forEach(([folder, subs]) => {
          const allEntries = Object.values(subs).flat();
          const hidePercent = folder === "Standard2";
          const folderPercent = computeFixedCompletionPercentage(folder, allEntries);
          const folderNode = createFolderNode(folder, folderPercent, userContent, hidePercent);

          if (subs["__root__"]) {
            const table = document.createElement("table");
            table.innerHTML = `<tr><th>File</th><th>Status</th><th>Comment</th></tr>`;
            subs["__root__"].forEach(e => table.appendChild(createRow(e)));
            folderNode.appendChild(table);
          }

          if (folder === "Standard2") {
            Object.entries(subs).forEach(([sub, items]) => {
              if (sub === "__root__") return;
              const subPath = `${folder}/${sub}`;
              const subPercent = computeFixedCompletionPercentage(subPath, items);
              const subNode = createFolderNode(sub, subPercent, folderNode);
              const table = document.createElement("table");
              table.innerHTML = `<tr><th>File</th><th>Status</th><th>Comment</th></tr>`;
              items.forEach(e => table.appendChild(createRow(e)));
              subNode.appendChild(table);
            });
          }
        });

        userSection.appendChild(userContent);
        dashboard.appendChild(userSection);
      });

      const errorListEl = document.getElementById("errorList");
      const grouped = {};
      allNoEntries.forEach(issue => {
        if (!grouped[issue.userId]) grouped[issue.userId] = [];
        grouped[issue.userId].push(issue);
      });

      Object.entries(grouped).forEach(([userId, issues]) => {
        const userItem = document.createElement("li");
        userItem.textContent = userId;
        userItem.style.fontWeight = "bold";
        userItem.style.cursor = "pointer";

        const subList = document.createElement("ul");
        subList.style.display = "none";
        subList.style.paddingLeft = "15px";

        // Sort by cleaned file name
issues.sort((a, b) => {
  const nameA = cleanFileName(a.fileKey).toLowerCase();
  const nameB = cleanFileName(b.fileKey).toLowerCase();
  return nameA.localeCompare(nameB, undefined, { numeric: true });
});

issues.forEach(issue => {
  const li = document.createElement("li");
  li.textContent = cleanFileName(issue.fileKey);
  li.style.cursor = "pointer";
  li.style.fontWeight = "normal";
  li.addEventListener("click", (e) => {
    e.stopPropagation();
    showCommentModal(issue.comment, issue.fileKey, issue.userId, issue.item, issue.status);
  });
  subList.appendChild(li);
});


        userItem.addEventListener("click", () => {
          subList.style.display = subList.style.display === "none" ? "block" : "none";
        });

        errorListEl.appendChild(userItem);
        errorListEl.appendChild(subList);
      });
    }

    loadDashboard();
  </script>
</body>
</html>
